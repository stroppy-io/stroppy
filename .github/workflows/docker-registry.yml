name: Build and Push Docker image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version to embed and publish from the selected ref
        required: true
        type: string

env:
  IMAGE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  docker-build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # needed for ghcr.io
      id-token: write # optional, but good for provenance / OIDC

    steps:
      - name: Validate version
        run: |
          if [[ ! "$IMAGE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release version: $IMAGE_VERSION"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Name lowercase
        id: lowercase
        uses: vishalmamidi/lowercase-action@v1
        with:
          string: ${{ github.repository }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          file: Dockerfile
          build-args: |
            VERSION=${{ env.IMAGE_VERSION }}
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.lowercase.outputs.lowercase }}:${{ env.IMAGE_VERSION }}.${{ github.run_number }}
            ghcr.io/${{ steps.lowercase.outputs.lowercase }}:latest

      # Guard: the pushed image's binary must report the pushed tag, not the
      # Docker ARG fallback. Running it also confirms the pushed image is sound.
      - name: Verify image version
        run: |
          expected="${{ env.IMAGE_VERSION }}"
          image="ghcr.io/${{ steps.lowercase.outputs.lowercase }}:${{ env.IMAGE_VERSION }}.${{ github.run_number }}"
          actual="$(docker run --rm "${image}" version --json | jq -r '.stroppy')"
          echo "expected=${expected}"
          echo "actual=${actual}"
          if [ "${actual}" != "${expected}" ]; then
            echo "version mismatch: ${actual} != ${expected}"
            exit 1
          fi
