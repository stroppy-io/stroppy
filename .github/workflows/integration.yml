name: Integration

on:
  workflow_call:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_USER: myuser
          MYSQL_PASSWORD: mypassword
          MYSQL_DATABASE: mydb
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -prootpassword --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Build once here; the publish job consumes this same binary via artifact,
      # so the pipeline never builds twice or tests a binary it didn't gate.
      - name: Build stroppy
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
          VERSION: nightly-${{ steps.sha.outputs.short }}
        run: make build

      # Guard: the produced nightly binary must report exactly nightly-<short-sha>
      # (not the 0.0.0/unknown fallback), so a broken version injection fails here.
      - name: Verify binary version
        run: |
          expected="nightly-${{ steps.sha.outputs.short }}"
          actual="$(./build/stroppy version --json | jq -r '.stroppy')"
          echo "expected=${expected}"
          echo "actual=${actual}"
          if [ "${actual}" != "${expected}" ]; then
            echo "version mismatch: ${actual} != ${expected}"
            exit 1
          fi

      # Tier 0: scenario-branch smoke on the noop driver — no database, exercises
      # both executor archetypes (constant-vus / shared-iterations) for every
      # workload. Fast and catches executor regressions for ~free.
      - name: Scenario smoke (noop, no DB)
        run: make run-scenario-smoke

      # Tier 1: real-Postgres smoke of both scenario branches for every workload.
      - name: Run workload branch tests (Postgres)
        run: make run-workload-branches

      - name: Run tagged baseline integration suite
        env:
          STROPPY_TMPFS_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
          STROPPY_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
          STROPPY_MYSQL_URL: myuser:mypassword@tcp(127.0.0.1:3306)/mydb?parseTime=true&multiStatements=true
        run: make integration

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: stroppy-linux-amd64
          path: build/stroppy
          if-no-files-found: error
          retention-days: 7
  # The injecting variant is the only part of the suite that needs a C extension inside
  # the server, so it gets its own job. Macavity is built here from the audited fork with
  # the same make target the workload's README documents — never fetched prebuilt, since
  # the extension is a .so that has to match the server it loads into. The check that
  # matters is the workload's own `verify` step: it runs with faults injected at commit,
  # and fails the job if the invariants did not hold.
  banking-inject:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install PostgreSQL and its build headers
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-server-dev-all build-essential

      - name: Build and install Macavity from the audited fork
        run: make macavity-install

      - name: Start the cluster and create the extension
        run: |
          sudo service postgresql start
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres psql -c "CREATE EXTENSION macavity;"
          sudo -u postgres psql -c "SELECT point FROM macavity_points();"

      - name: Run the injecting variant with faults at commit
        run: |
          make build
          ./build/stroppy run banking/inject -d pg \
            -D url='postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable' \
            --executor constant-vus --vus 4 --duration 10s --accounts 50 \
            --inject-action error --inject-every 5
