name: Integration

on:
  workflow_call:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_USER: myuser
          MYSQL_PASSWORD: mypassword
          MYSQL_DATABASE: mydb
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -prootpassword --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # Engines that speak another's protocol get their own service so the
      # integration matrix can reach them. Tags are `latest` because the version
      # schemes differ per vendor; pin them once a run confirms the tag.
      cockroachdb:
        image: cockroachdb/cockroach:latest
        ports:
          - 26257:26257
        # Insecure single node, as the workload's crdb preset expects.
        options: >-
          --health-cmd "cockroach sql --insecure -e 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

      yugabytedb:
        image: yugabytedb/yugabyte:latest
        ports:
          - 5433:5433
        # Its master bootstrap measured ~65 s on a small VM, so the retries are
        # generous and the tests would otherwise start before YSQL is up.
        options: >-
          --health-cmd "/home/yugabyte/bin/ysqlsh -h 127.0.0.1 -p 5433 -c 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Build once here; the publish job consumes this same binary via artifact,
      # so the pipeline never builds twice or tests a binary it didn't gate.
      - name: Build stroppy
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
          VERSION: nightly-${{ steps.sha.outputs.short }}
        run: make build

      # Guard: the produced nightly binary must report exactly nightly-<short-sha>
      # (not the 0.0.0/unknown fallback), so a broken version injection fails here.
      - name: Verify binary version
        run: |
          expected="nightly-${{ steps.sha.outputs.short }}"
          actual="$(./build/stroppy version --json | jq -r '.stroppy')"
          echo "expected=${expected}"
          echo "actual=${actual}"
          if [ "${actual}" != "${expected}" ]; then
            echo "version mismatch: ${actual} != ${expected}"
            exit 1
          fi

      # Tier 0: scenario-branch smoke on the noop driver — no database, exercises
      # both executor archetypes (constant-vus / shared-iterations) for every
      # workload. Fast and catches executor regressions for ~free.
      - name: Scenario smoke (noop, no DB)
        run: make run-scenario-smoke

      # Tier 1: real-Postgres smoke of both scenario branches for every workload.
      - name: Run workload branch tests (Postgres)
        run: make run-workload-branches

      - name: Run tagged baseline integration suite
        env:
          STROPPY_TMPFS_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
          STROPPY_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
          STROPPY_MYSQL_URL: myuser:mypassword@tcp(127.0.0.1:3306)/mydb?parseTime=true&multiStatements=true
        run: make integration

      # TiDB cannot be a service: a TiDB server is a playground of three processes
      # (pd, tikv, tidb), so it starts here and the matrix reaches it on 4000. The
      # version is pinned, unlike the services above, because tiup resolves a bare
      # `playground` to nightly and then fails to find it.
      - name: Start TiDB
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://tiup-mirrors.pingcap.com/install.sh | sh
          # --tiflash 0: a measurement run died with TiKV at 2.5 GiB RSS and 75 MiB
          # free, while the playground was also pulling a 526 MB TiFlash that TiDB
          # tests here do not need.
          ~/.tiup/bin/tiup playground v8.5.8 --without-monitor --tiflash 0 > /tmp/tidb.log 2>&1 &
          for _ in $(seq 1 60); do
            if mysqladmin ping -h 127.0.0.1 -P 4000 -u root --silent >/dev/null 2>&1; then
              echo "tidb is accepting connections"
              exit 0
            fi
            sleep 5
          done
          echo "tidb did not become ready; last lines of its log:"
          tail -50 /tmp/tidb.log
          exit 1

      # The engines that speak another protocol, on one workload each. Optional in
      # the harness's sense: absent services skip them rather than failing the job.
      - name: Run optional engine integration suite
        env:
          STROPPY_CRDB_URL: postgres://root@127.0.0.1:26257/defaultdb?sslmode=disable
          STROPPY_YUGABYTE_URL: postgres://yugabyte@127.0.0.1:5433/yugabyte?sslmode=disable
          STROPPY_TIDB_URL: root:@tcp(127.0.0.1:4000)/test?parseTime=true&multiStatements=true
        run: make integration-optional

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: stroppy-linux-amd64
          path: build/stroppy
          if-no-files-found: error
          retention-days: 7
  # The injecting variant is the only part of the suite that needs a C extension inside
  # the server, so it gets its own job. Macavity is built here from the audited fork with
  # the same make target the workload's README documents — never fetched prebuilt, since
  # the extension is a .so that has to match the server it loads into. The check that
  # matters is the workload's own `verify` step: it runs with faults injected at commit,
  # and fails the job if the invariants did not hold.
  banking-inject:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install PostgreSQL's build headers
        run: |
          # The runner already carries PGDG's postgresql-common, so Ubuntu's
          # postgresql-server-dev-all cannot coexist with it (it pins postgresql-common
          # to the distro version). Install the headers matching the server that is
          # already here, from the same repository — which is what this extension needs
          # in any case, since it compiles against the ABI it will load into.
          sudo apt-get install -y curl ca-certificates build-essential
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          # `pg_config --major` only exists from PostgreSQL 18, so the major version is
          # derived from --version, with a fallback to the installed server directories.
          major=$(pg_config --version 2>/dev/null | sed -E 's/^[^0-9]*([0-9]+).*/\1/')
          [ -n "$major" ] || major=$(ls /usr/lib/postgresql 2>/dev/null | sort -V | tail -1)
          sudo apt-get install -y "postgresql-server-dev-${major}"

      - name: Build and install Macavity from the audited fork
        run: make macavity-install

      - name: Start the cluster and create the extension
        run: |
          # The PGDG packages may be installed without a cluster; create one if the
          # service has nothing to start. Same version derivation as above, because
          # `pg_config --major` needs PostgreSQL 18.
          major=$(pg_config --version | sed -E 's/^[^0-9]*([0-9]+).*/\1/')
          sudo service postgresql start || sudo pg_createcluster "$major" main --start
          pg_isready -h 127.0.0.1 -p 5432
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres psql -c "CREATE EXTENSION macavity;"
          sudo -u postgres psql -c "SELECT point FROM macavity_points();"

      - name: Run the injecting variant with faults at commit
        run: |
          make build
          ./build/stroppy run banking/inject -d pg \
            -D url='postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable' \
            --executor constant-vus --vus 4 --duration 10s --accounts 50 \
            --inject-action error --inject-every 5
