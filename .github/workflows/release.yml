name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Use repo name as binary name by default; override if you need.
  BINARY_NAME: ${{ github.event.repository.name }}
  # Path to main of golang code
  BUILD_PATH: ./cmd/stroppy
  # Common ldflags: inject version and commit; trim paths; strip symbols.

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: [ci]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Compute names
        id: names
        shell: bash
        run: |
          BIN="${BINARY_NAME}"
          PKG="${BIN}_${{ matrix.os }}_${{ matrix.arch }}"
          OUTDIR="dist/${PKG}"
          ARCHIVE="${PKG}.tar.gz"
          echo "bin=${BIN}" >> $GITHUB_OUTPUT
          echo "pkg=${PKG}" >> $GITHUB_OUTPUT
          echo "outdir=${OUTDIR}" >> $GITHUB_OUTPUT
          echo "archive=${ARCHIVE}" >> $GITHUB_OUTPUT

      # Release builds carry the pg-noop baseline server inside the stroppy
      # binary (build tag pgnoop_embed), so `stroppy baseline` works without
      # any download on the released platforms.
      - name: Fetch pg-noop server for embedding
        env:
          # Keep in sync with internal/pgnoop.Version.
          PGNOOP_VERSION: v0.1.2
        run: |
          case "${{ matrix.os }}_${{ matrix.arch }}" in
            linux_amd64)  asset="pg-noop-x86_64-unknown-linux-musl.tar.xz" ;;
            linux_arm64)  asset="pg-noop-aarch64-unknown-linux-musl.tar.xz" ;;
            darwin_amd64) asset="pg-noop-x86_64-apple-darwin.tar.xz" ;;
            darwin_arm64) asset="pg-noop-aarch64-apple-darwin.tar.xz" ;;
          esac
          base="https://github.com/stroppy-io/pg-noop/releases/download/${PGNOOP_VERSION}"
          tmp="$(mktemp -d)"
          curl -sSfL -o "${tmp}/${asset}" "${base}/${asset}"
          curl -sSfL -o "${tmp}/${asset}.sha256" "${base}/${asset}.sha256"
          ( cd "${tmp}" && sha256sum -c "${asset}.sha256" )
          mkdir -p internal/pgnoop/embedded
          tar -xf "${tmp}/${asset}" -C "${tmp}"
          bin="$(find "${tmp}" -name pgnoop -type f | head -1)"
          install -m 0755 "${bin}" internal/pgnoop/embedded/pgnoop
          rm -rf "${tmp}"

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ github.ref_name }}
        run: |
          make build GO_BUILD_TAGS="-tags=pgnoop_embed"
          mkdir -p "${{ steps.names.outputs.outdir }}"
          cp build/stroppy "${{ steps.names.outputs.outdir }}/${{ steps.names.outputs.bin }}"

      # Guard: the release binary must embed exactly the release tag. Cross-compiled
      # binaries (darwin/arm64, linux/arm64, ...) cannot be executed on the ubuntu
      # runner, so assert the version `-X`-injected into the binary directly.
      - name: Verify version
        run: |
          expected="${{ github.ref_name }}"
          if ! strings build/stroppy | grep -Fqx "${expected}"; then
            echo "version mismatch: expected '${expected}' not embedded in build/stroppy"
            exit 1
          fi
          echo "version ok: ${expected}"

      #  [ -f ../README.md ] && EXTRAS+=("../README.md")
      #  [ -f ../LICENSE ] && EXTRAS+=("../LICENSE")
      - name: Package (.tar.gz)
        shell: bash
        run: |
          cd dist
          PKG="${{ steps.names.outputs.pkg }}"
          OUTDIR="${PKG}"
          EXTRAS=()
          tar -C "${OUTDIR}" -czf "${{ steps.names.outputs.archive }}" . ${EXTRAS[@]+"${EXTRAS[@]}"}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.names.outputs.pkg }}
          path: dist/${{ steps.names.outputs.archive }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Gather files
        id: gather
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=(dist/**/*.tar.gz)
          printf '%s\n' "${files[@]}" > files.txt
          echo "files<<EOF" >> $GITHUB_OUTPUT
          printf '%s\n' "${files[@]}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "count=${#files[@]}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.gather.outputs.files }}
          make_latest: true
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
